name: Website compatibility
description: Report a website where saving images does not work.
title: "Website: "
labels: []
body:
  - type: input
    id: website
    attributes:
      label: Website
      description: Use a public URL. Remove tokens and personal details.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Browser and PicLatch version
      description: Find the extension version on About & privacy.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the steps to reproduce it and what you expected.
    validations:
      required: true
